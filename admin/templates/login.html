<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Gallancourt</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
<style>
  .login-pagina { max-width: 360px; margin: 10vh auto; padding: 0 1rem; }
  .login-cartao { border: 1px solid #ccc; border-radius: 8px; padding: 1.5rem; }
  .login-cartao h1 { margin-top: 0; font-size: 1.3rem; }
  .login-cartao input[type="password"] { width: 100%; box-sizing: border-box; padding: 0.5rem; margin: 0.5rem 0 1rem; }
  .login-cartao button { width: 100%; padding: 0.6rem; cursor: pointer; }
  .login-erro { color: #b00020; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="login-pagina">
  <div class="login-cartao">
    <h1>⚔️ Gallancourt</h1>
    {% if erro %}<p class="login-erro">{{ erro }}</p>{% endif %}
    <form method="post" action="{{ url_for('fazer_login') }}">
      <input type="hidden" name="proximo" value="{{ proximo }}">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autofocus required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
