# Changelog de Crônicas de Gallancourt.
#
# Edite pelo Painel do Mestre (aba "Changelog"). A última versão da lista é "a versão atual",
# mostrada no selo no canto inferior esquerdo do site. A versão 1.0 só existe quando o projeto
# for considerado pronto — até lá, use números abaixo de 1.0 (0.1, 0.2...).
#
# Campos de cada versão:
#   id        número único (o Painel preenche)
#   versao    rótulo da versão (ex.: "0.1")
#   data      data real do lançamento (ex.: "2026-10-28")
#   mudancas  lista de textos, um por mudança

versoes:
- id: 1
  versao: '0.1'
  data: '2026-10-28'
  mudancas:
  - Changelog do projeto, com selo da versão atual no canto inferior esquerdo do site.
  - Roadmap com prioridade e funcionalidade por item, em docs/roadmap.
  - Botão de "Reportar bug", visível em qualquer página, com acompanhamento de status (Aguardando/Resolvido)
    pelo Painel do Mestre.
  - Menu da esquerda passou a abrir só uma categoria por vez (accordion).
- id: 2
  versao: '0.2'
  data: '2026-10-29'
  mudancas:
  - 'Ficha completa de personagem (opcional): perícias e salvaguardas com total calculado, inventário,
    grimório detalhado, características categorizadas e efeitos ativos — cada grupo vira sua própria aba
    na página (Ficha/Inventário/Grimório/Características/Efeitos).'
  - Biografia (antes só para NPC/cidade) agora também disponível para jogadores, com campos físicos novos
    (gênero, idade, altura, peso, olhos, cabelo, pele, fé).
  - Painel do Mestre ganhou login com senha, para acesso remoto seguro.
  - Site acessível pela internet (fora da rede local), via túnel seguro.
- id: 3
  versao: '0.3'
  data: '2026-10-30'
  mudancas:
  - 'Monstros saíram do Markdown e passaram a viver num banco de dados: agora é possível criar
    variantes de uma criatura (ex.: Goblin → Goblin Arqueiro) direto na própria página pública,
    trocando equipamento, traços/ações/reações e magias — tudo editável ao vivo, sem precisar
    reconstruir o site.'
  - 'Equipamento, Traços/Ações/Reações, Magias, Idiomas e Sentidos de monstros viraram catálogos
    compartilhados entre criaturas, com busca e filtro completos (as mesmas colunas das páginas de
    Itens/Magias) ao adicionar.'
  - 'Modo Mestre: a senha do Painel agora também libera edição direto nas páginas do site (botão no
    cabeçalho, ao lado do alternador claro/escuro — um popup simples, sem navegar para outra
    página). A leitura do site passou a ser livre para qualquer um; só criar/editar/excluir continua
    exigindo a senha.'
  - CA, CR, PV máximo e Deslocamento de monstros agora são editados com setas (incremento/decremento)
    direto onde aparecem na ficha, sem campo de edição separado no fim da página; movimento sobe ou
    desce em passos de 1,5 m.
  - 'Validação: campos numéricos de fichas de monstro e do catálogo não aceitam mais valores negativos
    onde não faz sentido.'
  - Roadmap agora é editável (adicionar, editar, excluir) direto na página pública em Modo Mestre,
    com um campo opcional de responsável por item — sem precisar abrir o Painel.
  - 'Menu da esquerda simplificado: só as categorias principais (Lore, Wiki, Compêndio, Mestre,
    Configurações) aparecem ali agora; as subcategorias (Mundo, Cidades, NPCs, Monstros...) são
    acessadas pelo corpo da página de cada categoria, como já funcionava para Monstros.'
- id: 4
  versao: '0.4'
  data: '2026-10-30'
  mudancas:
  - 'Perícias de monstro deixaram de ser texto livre: agora é um catálogo (as mesmas 18 perícias
    do D&D 5e) com um bônus numérico por criatura, pronto para uma futura rolagem automatizada
    (d20 + bônus), editável em Modo Mestre com busca/adicionar igual a equipamento e magias.'
  - 'Sentidos especiais (Visão no escuro, Visão cega...) agora guardam o alcance como número em
    metros, não texto — e duas entradas duplicadas do catálogo (criadas por uma divisão imperfeita
    do texto original) foram unificadas em "Visão cega".'
  - Percepção passiva agora é um campo numérico próprio da ficha (com seta de +/-, como CA e PV),
    em vez de aparecer misturada na lista de Sentidos.
