# Changelog de Crônicas de Gallancourt.
#
# Edite pelo Painel do Mestre (aba "Changelog"). A última versão da lista é "a versão atual",
# mostrada no selo no canto inferior esquerdo do site. A versão 1.0 só existe quando o projeto
# for considerado pronto — até lá, use números abaixo de 1.0 (0.1, 0.2...).
#
# Campos de cada versão:
#   id        número único (o Painel preenche)
#   versao    rótulo da versão (ex.: "0.1")
#   data      data real do lançamento (ex.: "2026-10-28")
#   mudancas  lista de textos, um por mudança

versoes:
- id: 1
  versao: '0.1'
  data: '2026-10-28'
  mudancas:
  - Changelog do projeto, com selo da versão atual no canto inferior esquerdo do site.
  - Roadmap com prioridade e funcionalidade por item, em docs/roadmap.
  - Botão de "Reportar bug", visível em qualquer página, com acompanhamento de status (Aguardando/Resolvido)
    pelo Painel do Mestre.
  - Menu da esquerda passou a abrir só uma categoria por vez (accordion).
- id: 2
  versao: '0.2'
  data: '2026-10-29'
  mudancas:
  - 'Ficha completa de personagem (opcional): perícias e salvaguardas com total calculado, inventário,
    grimório detalhado, características categorizadas e efeitos ativos — cada grupo vira sua própria aba
    na página (Ficha/Inventário/Grimório/Características/Efeitos).'
  - Biografia (antes só para NPC/cidade) agora também disponível para jogadores, com campos físicos novos
    (gênero, idade, altura, peso, olhos, cabelo, pele, fé).
  - Painel do Mestre ganhou login com senha, para acesso remoto seguro.
  - Site acessível pela internet (fora da rede local), via túnel seguro.
- id: 3
  versao: '0.3'
  data: '2026-10-30'
  mudancas:
  - 'Monstros saíram do Markdown e passaram a viver num banco de dados: agora é possível criar variantes
    de uma criatura (ex.: Goblin → Goblin Arqueiro) direto na própria página pública, trocando equipamento,
    traços/ações/reações e magias — tudo editável ao vivo, sem precisar reconstruir o site.'
  - Equipamento, Traços/Ações/Reações, Magias, Idiomas e Sentidos de monstros viraram catálogos compartilhados
    entre criaturas, com busca e filtro completos (as mesmas colunas das páginas de Itens/Magias) ao adicionar.
  - 'Modo Mestre: a senha do Painel agora também libera edição direto nas páginas do site (botão no cabeçalho,
    ao lado do alternador claro/escuro — um popup simples, sem navegar para outra página). A leitura do
    site passou a ser livre para qualquer um; só criar/editar/excluir continua exigindo a senha.'
  - CA, CR, PV máximo e Deslocamento de monstros agora são editados com setas (incremento/decremento)
    direto onde aparecem na ficha, sem campo de edição separado no fim da página; movimento sobe ou desce
    em passos de 1,5 m.
  - 'Validação: campos numéricos de fichas de monstro e do catálogo não aceitam mais valores negativos
    onde não faz sentido.'
  - Roadmap agora é editável (adicionar, editar, excluir) direto na página pública em Modo Mestre, com
    um campo opcional de responsável por item — sem precisar abrir o Painel.
  - 'Menu da esquerda simplificado: só as categorias principais (Lore, Wiki, Compêndio, Mestre, Configurações)
    aparecem ali agora; as subcategorias (Mundo, Cidades, NPCs, Monstros...) são acessadas pelo corpo
    da página de cada categoria, como já funcionava para Monstros.'
- id: 4
  versao: '0.4'
  data: '2026-10-30'
  mudancas:
  - 'Perícias de monstro deixaram de ser texto livre: agora é um catálogo (as mesmas 18 perícias do D&D
    5e) com um bônus numérico por criatura, pronto para uma futura rolagem automatizada (d20 + bônus),
    editável em Modo Mestre com busca/adicionar igual a equipamento e magias.'
  - Sentidos especiais (Visão no escuro, Visão cega...) agora guardam o alcance como número em metros,
    não texto — e duas entradas duplicadas do catálogo (criadas por uma divisão imperfeita do texto original)
    foram unificadas em "Visão cega".
  - Percepção passiva agora é um campo numérico próprio da ficha (com seta de +/-, como CA e PV), em vez
    de aparecer misturada na lista de Sentidos.
- id: 5
  versao: '0.5'
  data: '2026-11-03'
  mudancas:
  - 'Combat Tracker completo: iniciativa automática (com desempate por Destreza), participantes de ficha
    real ou cópia de monstro, resolução de ataques/testes/resistências, condições, log de rodadas e fim
    de combate com loot dividido.'
  - Resistências/imunidades/vulnerabilidades a dano na ficha, com grade de toggle (3 modos) igual às condições.
  - CD de conjuração e bônus de ataque mágico no topo do Grimório; Subclasse ao lado de Classe; Investigação
    e Intuição passivas ao lado de Percepção passiva.
  - Favoritar (★) habilidades e magias — sobem para o topo da lista na Ficha e no Painel de combate.
  - Contador real de uso de habilidades por descanso (curto/longo), com botão 'usar' e novo botão 'Descanso
    curto' (reseta só os contadores de descanso curto).
  - Carga de inventário calculada automaticamente (peso x quantidade) com alerta visual ao exceder a carga
    máxima.
  - Evasão (habilidade) agora zera o dano em resistências de área bem-sucedidas; loot de combate passa
    a somar moeda extra automaticamente pelo CR médio dos monstros derrotados.
  - Log de combate mostra o horário de cada evento, no site e na exportação .txt.
  - 'Correção: link morto em ''Manutenção do Cânone'' que travava todo build --strict do site.'
  - 'Correção: aviso falso de ''não entrou no menu'' ao criar NPC/Lugar/Jogador pelo Painel (o menu já
    era plano desde a v0.3; o código de inserção antigo nunca mais funcionava).'
- id: 6
  versao: '0.6'
  data: '2026-11-03'
  mudancas:
  - 'Reportar bug agora é público de verdade: o botão flutuante abre um popup (sem navegar pra outra página,
    sem precisar de senha do Mestre) em vez de redirecionar para a tela de login.'
  - Bug report ganhou página (capturada automaticamente da URL atual) e versão (capturada automaticamente
    do changelog); o campo 'Área' foi substituído por um novo campo 'Tipo' (Visual, Funcional, Dados incorretos,
    Desempenho, Outro).
  - Triagem de bugs no Painel (/bugs) mostra as novas colunas Página/Tipo/Versão.
  - 'Correção: desde que a senha do Painel passou a valer para todo o site, o botão ''Reportar bug'' ficava
    preso na tela de login — agora é 100% público.'
  - Criado scripts/registrar_changelog.py para o Claude Code registrar versões no changelog sem precisar
    abrir o Painel pelo navegador.
  - 'Roadmap: marcados como concluídos os itens ''Fazer o combat tracker'' e ''Commitar o trabalho pendente'',
    que já estavam feitos mas ainda apareciam como Planejado.'
- id: 7
  versao: '0.7'
  data: '2026-11-03'
  mudancas:
  - 'Correção: a seção ''Depois da sessão'', nas páginas de sessão, aparecia no final de TODAS as abas
    (Resumo, Cenas, NPCs...); agora só aparece dentro da aba Resumo, onde deveria estar desde o início.'
  - 'Combat Tracker: reforma visual completa seguindo a especificação original — painel com tons escuros
    fixos de VTT (independente do tema claro/escuro do site), barra de PV colorida (verde/âmbar/vermelho)
    nos cards e no Painel do Token, grade compacta de ícones de condição (sem mais siglas coladas/colidindo),
    chip de CA, economia de ação (1 Ação/Bônus/Reação) como chips, e o campo de reação (Contramagia/Esquiva)
    que ficava cortado agora ocupa a largura toda.'
- id: 8
  versao: '0.8'
  data: '2026-11-03'
  mudancas:
  - Novo módulo de conversão PDF -> Markdown (scripts/converter_pdfs.py), usando Docling para reconstruir
    com alta fidelidade o texto, títulos e tabelas dos livros em referencias/pdfs/, sem precisar de OCR
    (os PDFs já têm texto selecionável). Roda num ambiente Python isolado (.venv-pdf), separado do ambiente
    do Painel.
  - Criado o guia PDF_CONVERTER.md na raiz do projeto, explicando como instalar o ambiente e converter
    um PDF específico (por número, por nome ou todos de uma vez).
  - referencias/pdfs/ (os livros originais e os .md gerados) e .venv-pdf/ passam a ser ignorados pelo
    git — não sobem para o repositório remoto.
- id: 9
  versao: '0.9'
  data: '2026-11-04'
  mudancas:
  - 'Reforma visual da Ficha de Personagem no estilo D&D Beyond (jogador/NPC/monstro, mesmo componente):
    fileira de atributos (CA + 6 atributos + Iniciativa) e barra de PV colorida agora ficam sempre visíveis
    no cabeçalho, fora das abas; a aba Atributos ganhou uma lista de ★ Favoritos que agrega equipamento,
    magias e habilidades marcados, com filtro por tipo de ação (Ação/Ação Bônus/Reação).'
  - Novo campo tipo_acao em Equipamento/Magia/Habilidade e favorito em FichaEquipamento (migração + scripts/preencher_tipo_acao.py,
    que já classificou os 417 magias/366 habilidades/303 equipamentos existentes a partir dos dados do
    catálogo).
  - Jogadores saem de dentro de Mestre e viram uma seção da Wiki (docs/wiki/jogadores/, ao lado de NPCs
    e Monstros) — mesma URL pública de antes, só reorganizado; todos os links internos e rotas do Painel
    foram atualizados.
- id: 10
  versao: '0.10'
  data: '2026-11-04'
  mudancas:
  - 'Encontro planejado: a aba NPCs das páginas de sessão ganhou uma lista de rascunhos de combate (escolher
    NPCs/monstros/jogadores do banco com antecedência); o botão Iniciar combate do Combat Tracker agora
    pode carregar um desses rascunhos de uma vez, em vez de adicionar participante por participante na
    hora.'
  - Combat Tracker passa a bloquear (com opção de forçar) conjurar magia sem espaço de magia do nível
    certo ou usar item mágico sem carga disponível — agora vale também para monstros (cópia isolada por
    participante, sem tocar a Ficha real do catálogo), não só NPC/jogador.
  - Novo campo cargas_maximo em Equipamento (catálogo) e cargas_atual em FichaEquipamento (por ficha)
    para itens mágicos com carga; item sem cargas continua se comportando como consumível normal (quantidade).
- id: 11
  versao: '0.11'
  data: '2026-11-04'
  mudancas:
  - 'Motor de nível: botão "Subir de nível" na ficha de jogador/NPC — escolhe (ou cria na hora) Classe/Subclasse
    e calcula sozinho PV ganho, bônus de proficiência e espaços de magia (inclusive multiclasse e Magia
    de Pacto do Bruxo), além de desbloquear automaticamente as features de classe cadastradas para aquele
    nível.'
  - Novo catálogo Classe/Subclasse/ClasseFeature (admin/banco.py) e tabela FichaClasse para multiclasse
    estruturada — cresce sob demanda, sem seed de classes do PHB; nada muda em fichas que não usarem o
    botão novo.
  - Reverte, a pedido do autor, a decisão anterior de classe/subclasse serem só texto livre sem cálculo
    — documentado em .claude/contexto/personagens.md.
- id: 12
  versao: '0.12'
  data: '2026-11-05'
  mudancas:
  - 'Visual novo de ficha de personagem e Combat Tracker (baseado em designs do autor no app do Claude):
    fontes/paleta repintadas, barra de experiência no cabeçalho integrada ao botão "Subir de nível", símbolos
    de ação/ação bônus/reação, pips de pool de magia/carga de item e banner "Ação bloqueada" (Cancelar/Forçar)
    no lugar do confirm() do navegador, modal de "Iniciar combate" com prévia dos encontros planejados.'
  - 'Inventário ganha contêineres de verdade: Equipamento.e_container/capacidade_kg marca um item como
    mochila/bolsa, FichaEquipamento.guardado_em_vinculo_id guarda outro item dentro dele (PUT /api/fichas/<id>/equipamentos/<vinculo>,
    nova rota); passar da capacidade avisa, não bloqueia. Também corrige a lacuna de não dar pra equipar/trocar
    quantidade depois que o item já foi adicionado.'
  - Combate ganha Movimento na economia de ação (CombateParticipante.movimento_usado), junto de Ação/Ação
    Bônus/Reação, resetado a cada turno do mesmo jeito.
- id: 13
  versao: '0.13'
  data: '2026-11-05'
  mudancas:
  - Novo painel "Master's Shield" nas páginas de sessão — sempre visível, com calendário de jogo, localidade
    atual (lugares cadastrados ou provisórios criados ao vivo) e um log de interações relacional (participantes,
    perícia/CD, rolagens manuais ou online).
  - O Combat Tracker (iniciativa, turnos, PV, recursos) continua existindo exatamente como antes, agora
    aninhado dentro do Master's Shield.
  - Distribuição de XP e aplicação de loot ao fim de um combate passam a deixar rastro no log de interações
    (antes não geravam nenhum registro).
  - Conversão dos livros Livro do Jogador, Guia de Xanathar, Caldeirão de Tasha e Manual dos Monstros
    de PDF para Markdown, pra alimentar a wiki.
- id: 14
  versao: '0.14'
  data: '2026-11-06'
  mudancas:
  - Catálogo de Raças (novo, com traços raciais) semeado a partir do Livro do Jogador — 9 raças base +
    9 sub-raças/linhagens.
  - Catálogo de Classes semeado com as 12 classes do Livro do Jogador (dado de vida, atributo de conjuração).
  - Catálogo de Magias (417) e Itens (303) passam a referenciar a Fonte de verdade (PHB/XGE/Caldeirão
    de Tasha), em vez de só um texto livre.
  - 58 monstros novos importados do Manual dos Monstros pro catálogo (de 98 pra 156), cada um com página
    própria na wiki.
  - O sistema agora registra quais livros já alimentaram os catálogos (Fonte.importado_em) — o Guia de
    Xanathar ainda não entrou, por precisar de uma reconversão do PDF.
