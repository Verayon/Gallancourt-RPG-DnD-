# Linha do tempo da campanha de Gallancourt.
#
# Edite pelo Painel do Mestre (aba "Linha do tempo"). Cada acontecimento aparece, em ordem
# cronológica, na página de cada NPC, cidade ou facção envolvida; as mudanças de estado
# (situação, localização, afiliação, título) atualizam a caixa do NPC e a tabela de NPCs.
#
# Campos de cada acontecimento:
#   id         número único (o Painel preenche)
#   data       data na campanha, no formato "DD de <mês> de <ano>" (ver docs/mundo/calendario.md)
#   sessao     número da sessão (opcional)
#   titulo     resumo curto
#   descricao  texto (aceita Markdown)
#   envolvidos páginas envolvidas, relativas a docs/ (ex.: personagens/thalin.md)
#   notas      (opcional) nota específica de cada página: {pagina: texto}
#   mudancas   lista de {pagina, campo, valor}; campos: situacao, cidade, afiliacao, titulo

eventos:
- id: 1
  data: 25 de outubro de 1453
  sessao: 0
  titulo: Os Grilhões da Estrada
  descricao: 'A sessão aconteceu em 25 de outubro de 2026 (25 de outubro de 1453 no calendário da campanha).
    A maioria do grupo — **Trembolinha** (Tinker), **Faeris Thalendar** (Ana), **Vivien Elaris** (Luke),
    **Elariel Fogo do Sol** (Bel) e **Rowan CataPedras** (Miguel) — começou a sessão presa e acorrentada
    numa carroça de bandidos, exatamente como previsto na preparação.


    Durante a viagem, acorrentados, Rowan tentou capotar a carroça e agarrar um dos guardas com a ajuda
    de outros prisioneiros, sem sucesso; Vivien conseguiu chamar a atenção de um dos condutores, mas o
    sol se pôs e a carroça parou com todos ainda presos.


    Depois de um tempo, um desconhecido se aproximou e jogou uma chave para que o grupo se soltasse —
    o que levou um tempo, mas funcionou. Um dos guardas, porém, viu a fuga e tocou o alarme, alertando
    todo o acampamento. O resgatador avisou que ajuda estava a caminho: Faeris, Elariel e Trembolinha
    avançaram em direção às barracas, Rowan escalou uma parede de pedra, e Vivien se escondeu nos arbustos
    durante a confusão.


    O grupo driblou, enganou ou fugiu dos captores até a ajuda do Marquês [Alaric Duvant](../personagens/alaric-duvant.md)
    chegar à clareira — junto com **Astraelle** (Mari), a meio-gigante que é mão direita de Alaric em
    Dodixie, e **Perry** (Maria Clara), um castor falante homebrew amigo de Rowan, que não estavam entre
    os capturados. A sessão terminou com todos os jogadores em segurança, os equipamentos recuperados
    e o **Sargento Grum** capturado vivo pelos soldados do Marquês.'
  notas:
    personagens/alaric-duvant.md: Lidera pessoalmente o resgate do grupo na clareira; Astraelle, sua mão
      direita em Dodixie, e o aliado Perry chegam com ele.
