site_name: Crônicas de Gallancourt
site_description: Wiki de lore da campanha de RPG (D&D) ambientada em Gallancourt.
docs_dir: docs
use_directory_urls: true

validation:
  links:
    anchors: warn

theme:
  name: material
  language: pt-BR
  font: false
  icon:
    logo: material/sword-cross
  favicon: assets/favicon.svg
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro (Pergaminho)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro (Grimório)

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/painel-fetch.js
  - javascripts/gallancourt.js
  - javascripts/criar-sessao.js
  - javascripts/modo-mestre.js
  - javascripts/ficha.js
  - javascripts/roadmap.js
  - javascripts/combate.js

hooks:
  - hooks/gallancourt.py

plugins:
  - search:
      lang: pt
  - tags
  - git-revision-date-localized:
      type: date
      locale: pt
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Menu da esquerda só com as categorias de topo (ver docs/mestre/manutencao-do-canone.md —
# "Como é uma página de..."): cada subcategoria/página individual vive como link no corpo da
# página principal da categoria (grid de cards, tabela ou lista), não mais aqui. Todas essas
# páginas continuam existindo e acessíveis por link direto — só não aparecem na árvore do menu.
nav:
  - Início: index.md
  - Lore: lore/index.md
  - Wiki: wiki/index.md
  - Compêndio: compendio/index.md
  - Mestre: mestre/index.md
  - Configurações: configuracoes/index.md
  - Changelog: changelog/index.md
  - Roadmap: roadmap/index.md
