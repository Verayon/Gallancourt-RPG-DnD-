<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a1512"/>
      <stop offset="40%" stop-color="#3a2f38"/>
      <stop offset="72%" stop-color="#6b5258"/>
      <stop offset="100%" stop-color="#b7914f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#f7e6b4" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f7e6b4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f7e6b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f4e9c9">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="160" r="1.2" opacity="0.6"/>
    <circle cx="360" cy="70" r="1.8" opacity="0.7"/>
    <circle cx="470" cy="140" r="1.2" opacity="0.5"/>
    <circle cx="560" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="80" cy="220" r="1.2" opacity="0.5"/>
    <circle cx="700" cy="110" r="1.6" opacity="0.6"/>
    <circle cx="820" cy="50" r="1.3" opacity="0.6"/>
    <circle cx="950" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="230" cy="260" r="1.1" opacity="0.4"/>
    <circle cx="30" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="640" cy="220" r="1.1" opacity="0.4"/>
    <circle cx="1550" cy="120" r="1.4" opacity="0.6"/>
    <circle cx="1480" cy="60" r="1.2" opacity="0.5"/>
  </g>

  <!-- moon with glow -->
  <circle cx="1180" cy="210" r="170" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="210" r="62" fill="#f7ecc9"/>
  <circle cx="1160" cy="190" r="62" fill="#1a1512" opacity="0.06"/>

  <!-- distant birds -->
  <g stroke="#1a1512" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M 330 190 q 12 -14 24 0 q 12 -14 24 0"/>
    <path d="M 390 210 q 10 -12 20 0 q 10 -12 20 0"/>
    <path d="M 900 260 q 11 -13 22 0 q 11 -13 22 0"/>
  </g>

  <!-- far mountain ridge -->
  <polygon fill="#4a3a3c" opacity="0.85" points="
    0,640 110,560 210,610 330,470 440,560 560,500 680,600
    800,520 930,590 1060,510 1190,580 1320,520 1440,590
    1600,540 1600,900 0,900"/>

  <!-- mid mountain ridge -->
  <polygon fill="#2e2428" points="
    0,720 140,610 260,670 400,520 500,600 618,558 700,610
    840,500 980,600 1120,540 1260,640 1400,580 1600,650
    1600,900 0,900"/>

  <!-- watchtower on the mid peak -->
  <g fill="#211c1e">
    <rect x="606" y="480" width="18" height="80"/>
    <polygon points="600,480 630,480 615,448"/>
    <rect x="600" y="492" width="30" height="7"/>
  </g>

  <!-- near hills / treeline -->
  <polygon fill="#16120f" points="
    0,800 180,760 360,800 560,750 760,790 980,745
    1200,795 1400,755 1600,780 1600,900 0,900"/>

  <!-- pine silhouettes along the treeline -->
  <g fill="#110d0a">
    <g transform="translate(90,740)">
      <polygon points="0,60 -22,60 -11,30"/>
      <polygon points="0,38 -18,38 0,10 18,38"/>
      <polygon points="0,20 -14,20 0,-4 14,20"/>
    </g>
    <g transform="translate(300,760)">
      <polygon points="0,50 -18,50 -9,24"/>
      <polygon points="0,30 -15,30 0,8 15,30"/>
      <polygon points="0,14 -11,14 0,-6 11,14"/>
    </g>
    <g transform="translate(560,742)">
      <polygon points="0,64 -24,64 -12,32"/>
      <polygon points="0,40 -20,40 0,10 20,40"/>
      <polygon points="0,20 -15,20 0,-6 15,20"/>
    </g>
    <g transform="translate(1010,738)">
      <polygon points="0,58 -20,58 -10,28"/>
      <polygon points="0,34 -17,34 0,8 17,34"/>
      <polygon points="0,16 -12,16 0,-6 12,16"/>
    </g>
    <g transform="translate(1330,748)">
      <polygon points="0,52 -19,52 -9,26"/>
      <polygon points="0,32 -16,32 0,8 16,32"/>
      <polygon points="0,15 -12,15 0,-6 12,15"/>
    </g>
  </g>
</svg>
